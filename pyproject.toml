"tests/test_modal_image_pins.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]
"tests/test_rlvr_launch.py" = ["TID251"]
"tests/test_enforced_rules.py" = ["TID251"]
"scripts/modal_rlvr_grpo.py" = ["TID251"]
".agents/skills/verify-esme-posttrain/verify" = ["TID251"]
"scripts/modal_chat_sft.py" = ["TID251"]
"scripts/modal_chat_dpo.py" = ["TID251"]
"scripts/modal_emit_completions.py" = ["TID251"]
