[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esme-posttrain"
version = "0.0.0"
description = "Post-training: SFT -> DPO -> RLVR for Esme-214M."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen" }]
dependencies = [
    "datasets>=5.0.0",
    "modal>=1.5.1",
    "numpy>=2.4.6",
    "pydantic>=2.12",
    "tokenizers>=0.23.1",
    "torch>=2.12.1",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright==1.40.2",
  "import-linter>=2.15",
  "pytest>=8.2",
  "pytest-xdist>=3.8.0",
  "ruff==0.17.4",
]

[project.scripts]
esme-posttrain = "esme_posttrain.cli:main"

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
pythonVersion = "3.14"
include = ["src/esme_posttrain", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
# Importing a name through a module that only re-exports it is an error.
reportPrivateLocalImportUsage = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false
extraPaths = [".", "src"]

[tool.importlinter]
root_package = "esme_posttrain"

[[tool.importlinter.contracts]]
id = "dependency-direction"
name = "Entry points depend on stages, stages depend on shared code"
type = "layers"
containers = ["esme_posttrain"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "acceptance : studies",
    "sft | dpo | rl",
    "export",
    "training : launch : run_artifacts : evals : bundle : modeling",
]
# DPO shares the SFT chat format, sampling, and CPU fixture builders.
ignore_imports = [
    "esme_posttrain.dpo.** -> esme_posttrain.sft.data",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.data_types",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.sampling",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.fixtures",
]
broken_contract_guidance = """
Import shared behavior from its owner in training/, launch/, bundle.py, or modeling.py.
For example, import WandbConfig from esme_posttrain.training.wandb_init, not a stage trainer.
Keep cross-stage coordination in acceptance/ or cli/.
DPO may reuse sft.data, sft.data_types, sft.sampling, and sft.fixtures.
Place a new top-level module in these layers. See docs/package-layout.md for ownership.
"""

[[tool.importlinter.contracts]]
id = "dpo-without-sft-trainer"
name = "DPO reuses SFT chat code without depending on the SFT trainer"
type = "forbidden"
source_modules = ["esme_posttrain.dpo"]
forbidden_modules = ["esme_posttrain.sft.trainer"]
broken_contract_guidance = """
Use training.wandb_init.WandbConfig for monitoring and sft.fixtures for tiny models and tokenizers.
Keep SFT trainer imports out of shared chat and fixture code too. This check follows indirect imports.
"""

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003", "PGH004", "TID251"]
ignore = ["E501"]

# Process, network, and paid-service modules live only in their owner files.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Process calls live in launch/modal_cli.py (git) and the verify script."
"asyncio.subprocess".msg = "Process calls live in launch/modal_cli.py (git) and the verify script."
"os.system".msg = "Use launch/modal_cli.py for process calls."
"os.popen".msg = "Use launch/modal_cli.py for process calls."
"os.execv".msg = "Use launch/modal_cli.py for process calls."
"os.execvp".msg = "Use launch/modal_cli.py for process calls."
"os.spawnv".msg = "Use launch/modal_cli.py for process calls."
"pty".msg = "No pseudo-terminals in this repo."
"socket".msg = "No network clients; only the verify script's tripwire wraps socket."
"http.client".msg = "No network clients in this repo."
"urllib.request".msg = "No network clients in this repo."
"requests".msg = "No network clients in this repo."
"httpx".msg = "No network clients in this repo."
"modal".msg = "Modal spends: import it only in an approval-gated scripts/modal_*.py launcher."
"wandb".msg = "W&B is imported only by training/wandb_init.py."
"datasets".msg = "Remote dataset reads go through sft/data.py behind the download flag."
"huggingface_hub".msg = "Remote downloads go through sft/data.py behind the download flag."
"openai".msg = "No paid LLM APIs in this repo."
"anthropic".msg = "No paid LLM APIs in this repo."

[tool.ruff.lint.per-file-ignores]
"scripts/modal_*.py" = ["TID251"]
"src/esme_posttrain/launch/modal_cli.py" = ["TID251"]
"src/esme_posttrain/training/wandb_init.py" = ["TID251"]
".agents/skills/verify-esme-posttrain/verify" = ["TID251"]
"tests/test_enforced_rules.py" = ["TID251"]
"tests/test_rlvr_launch.py" = ["TID251"]
"tests/test_strict_mode.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/esme_posttrain"]
