[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esme-posttrain"
version = "0.0.0"
description = "Post-training: SFT -> DPO -> RLVR for Esme-214M."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen" }]
dependencies = [
    "datasets>=5.0.0",
    "modal>=1.5.1",
    "numpy>=2.4.6",
    "pydantic>=2.12",
    "tokenizers>=0.23.1",
    "torch>=2.12.1",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright==1.40.2",
  "import-linter>=2.15",
  "pytest>=8.2",
  "pytest-xdist>=3.8.0",
  "ruff==0.17.4",
]

[project.scripts]
esme-posttrain = "esme_posttrain.cli:main"

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportIgnoreCommentWithoutRule = "error"
pythonVersion = "3.14"
include = ["src/esme_posttrain", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
# Importing a name through a module that only re-exports it is an error.
reportPrivateLocalImportUsage = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false
extraPaths = [".", "src"]

[tool.importlinter]
root_package = "esme_posttrain"

[[tool.importlinter.contracts]]
id = "dependency-direction"
name = "Modules import only lower layers (cli > acceptance > stages > chat > export > shared); import shared code from its owner"
type = "layers"
containers = ["esme_posttrain"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "acceptance : studies",
    "sft | dpo | rl",
    "chat",
    "export",
    "training : launch : run_artifacts : evals : bundle : modeling",
]
broken_contract_guidance = """
Import shared behavior from its owner in training/, launch/, bundle.py, or modeling.py.
For example, import WandbConfig from esme_posttrain.training.wandb_init, not a stage trainer.
Keep cross-stage coordination in acceptance/ or cli/.
SFT and DPO share chat rows, sampling, and CPU fixtures through chat/.
Place a new top-level module in these layers. See docs/package-layout.md for ownership.
"""

[[tool.importlinter.contracts]]
id = "stage-config-without-launch"
name = "A stage config.py must not import its launch module; move the shared value into config.py"
type = "forbidden"
source_modules = ["esme_posttrain.sft.config", "esme_posttrain.dpo.config", "esme_posttrain.rl.config"]
forbidden_modules = [
    "esme_posttrain.sft.launch_multiturn",
    "esme_posttrain.sft.launch_shared",
    "esme_posttrain.dpo.launch",
    "esme_posttrain.rl.launch",
]
broken_contract_guidance = """
A stage's config.py owns typed settings and recipe checks. Its launch module reads the config,
checks files on disk, and builds launch plans. Move the shared value into config.py instead.
"""

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003", "PGH004", "TID251"]
ignore = ["E501"]

# Process, network, and paid-service modules live only in their owner files.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run git through launch/modal_cli.py. Other process calls belong only to the verify script and the git-reading tests in tests/test_strict_mode.py OWNED_BANS."
