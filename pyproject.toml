[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esme-posttrain"
version = "0.0.0"
description = "Post-training: SFT -> DPO -> RLVR for Esme-214M."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Adam Thuvesen" }]
dependencies = [
    "datasets>=5.0.0",
    "modal>=1.5.1",
    "numpy>=2.4.6",
    "pydantic>=2.12",
    "tokenizers>=0.23.1",
    "torch>=2.12.1",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "basedpyright==1.40.2",
  "import-linter>=2.15",
  "pytest>=8.2",
  "pytest-xdist>=3.8.0",
  "ruff==0.17.4",
]

[project.scripts]
esme-posttrain = "esme_posttrain.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src/esme_posttrain", "scripts", "tests"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false
# Importing a name through a module that only re-exports it is an error.
reportPrivateLocalImportUsage = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false
extraPaths = [".", "src"]

[tool.importlinter]
root_package = "esme_posttrain"

[[tool.importlinter.contracts]]
id = "dependency-direction"
name = "Entry points depend on stages, stages depend on shared code"
type = "layers"
containers = ["esme_posttrain"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "acceptance : studies",
    "sft | dpo | rl",
    "export",
    "training : launch : run_artifacts : evals : bundle : modeling",
]
# DPO shares the SFT chat format, sampling, and CPU fixture builders.
ignore_imports = [
    "esme_posttrain.dpo.** -> esme_posttrain.sft.data",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.data_types",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.sampling",
    "esme_posttrain.dpo.** -> esme_posttrain.sft.fixtures",
]
broken_contract_guidance = """
Import shared behavior from its owner in training/, launch/, bundle.py, or modeling.py.
For example, import WandbConfig from esme_posttrain.training.wandb_init, not a stage trainer.
Keep cross-stage coordination in acceptance/ or cli/.
DPO may reuse sft.data, sft.data_types, sft.sampling, and sft.fixtures.
Place a new top-level module in these layers. See docs/package-layout.md for ownership.
"""

[[tool.importlinter.contracts]]
id = "dpo-without-sft-trainer"
name = "DPO reuses SFT chat code without depending on the SFT trainer"
type = "forbidden"
source_modules = ["esme_posttrain.dpo"]
forbidden_modules = ["esme_posttrain.sft.trainer"]
broken_contract_guidance = """
Use training.wandb_init.WandbConfig for monitoring and sft.fixtures for tiny models and tokenizers.
Keep SFT trainer imports out of shared chat and fixture code too. This check follows indirect imports.
"""

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/esme_posttrain"]
